plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'hipstershop'
version = '0.1.0-SNAPSHOT'
description = 'Ad Service (Online Boutique replica)'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

def grpcVersion = '1.82.1'
def protobufVersion = '4.35.1'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation "io.grpc:grpc-netty:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-services:${grpcVersion}" // ProtoReflectionService (grpcurl)
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    // The committed genproto/java stubs (generated by the grpc-java protoc plugin)
    // carry @javax.annotation.Generated on the service stubs.
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "io.grpc:grpc-testing:${grpcVersion}"
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
}

// Consume the committed generated sources (protos/ -> genproto/java) directly,
// so no protoc / codegen is required at build time. This includes the committed
// grpc.health.v1 contract, which the health service (HealthServiceImpl) implements.
sourceSets {
    main {
        java {
            srcDirs 'src/main/java', '../../genproto/java'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
