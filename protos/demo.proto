// demo.proto — shared domain model for the Online Boutique replica.
//
// Wire-compatible with upstream GoogleCloudPlatform/microservices-demo
// (same package `hipstershop`, same message names and field numbers).
// Service definitions live in the per-service files under protos/:
//   cart.proto, checkout.proto, product_catalog.proto, shipping.proto,
//   currency.proto, payment.proto, email.proto, recommendation.proto,
//   shopping_assistant.proto, ad.proto
//
// frontend and loadgenerator are client-only services and consume the
// generated clients of the services above; they define no server contract.

syntax = "proto3";

package hipstershop;

option go_package = "github.com/Ayanamiz41/microservice-demo/genproto/go/hipstershop";

// Represents an amount of money with its currency type.
message Money {
  // The 3-letter currency code defined in ISO 4217.
  string currency_code = 1;

  // The whole units of the amount.
  // For example if `currencyCode` is `"USD"`, then 1 unit is one US dollar.
  int64 units = 2;

  // Number of nano (10^-9) units of the amount.
  // The value must be between -999,999,999 and +999,999,999 inclusive.
  // If `units` is positive, `nanos` must be positive or zero.
  // If `units` is zero, `nanos` can be positive, zero, or negative.
  // If `units` is negative, `nanos` must be negative or zero.
  // For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
  int32 nanos = 3;
}

// A shipping address.
message Address {
  string street_address = 1;
  string city = 2;
  string state = 3;
  string country = 4;
  int32 zip_code = 5;
}

// An item in the shopping cart.
message CartItem {
  string product_id = 1;
  int32  quantity = 2;
}

// The shopping cart of a user.
message Cart {
  string user_id = 1;
  repeated CartItem items = 2;
}

// Generic empty message (kept for upstream compatibility instead of
// google.protobuf.Empty).
message Empty {}

// A product offered by the store.
message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  string picture = 4;
  Money price_usd = 5;

  // Categories such as "clothing" or "kitchen" that can be used to look up
  // other related products.
  repeated string categories = 6;
}

// Credit card information submitted by the user at checkout.
message CreditCardInfo {
  string credit_card_number = 1;
  int32 credit_card_cvv = 2;
  int32 credit_card_expiration_year = 3;
  int32 credit_card_expiration_month = 4;
}

// A single line of an order.
message OrderItem {
  CartItem item = 1;
  Money cost = 2;
}

// The result of a placed order.
message OrderResult {
  string   order_id = 1;
  string   shipping_tracking_id = 2;
  Money shipping_cost = 3;
  Address  shipping_address = 4;
  repeated OrderItem items = 5;
}
