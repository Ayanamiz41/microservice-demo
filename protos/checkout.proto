// checkout.proto — CheckoutService contract (Go checkoutservice).
// Wire-compatible with upstream GoogleCloudPlatform/microservices-demo.

syntax = "proto3";

package hipstershop;

import "demo.proto";

option go_package = "github.com/Ayanamiz41/microservice-demo/genproto/go/hipstershop";

// -----------------Checkout service------------------

service CheckoutService {
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse) {}
}

message PlaceOrderRequest {
  string user_id = 1;
  string user_currency = 2;

  Address address = 3;
  string email = 5;
  CreditCardInfo credit_card = 6;
  // NOTE: field 4 was retired upstream; numbers are kept identical for
  // wire compatibility.
}

message PlaceOrderResponse {
  OrderResult order = 1;
}
